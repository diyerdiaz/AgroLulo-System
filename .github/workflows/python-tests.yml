# Corre todas las pruebas (carpeta tests/) en los computadores de GitHub
# cada vez que se sube código o se abre un Pull Request hacia main. Si
# alguna prueba falla, GitHub lo marca con una X roja; si todas pasan,
# con un chulo verde.
name: Pruebas de AgroLulo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Permite correrlas a mano desde la pestaña "Actions" de GitHub.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          # La misma versión que usa el Dockerfile.
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Correr las pruebas con pytest
        env:
          PYTHONPATH: .
        run: pytest
