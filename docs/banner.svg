<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="AgroLulo System - Control financiero para el cultivo de lulo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100a"/>
      <stop offset="1" stop-color="#0f1f14"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39ff14" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39ff14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#39ff14" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="url(#fondo)"/>
  <rect width="1280" height="400" fill="url(#puntos)"/>

  <!-- Hojas decorativas -->
  <path d="M1180 -20c80 40 110 140 60 230 -70-30-110-130-60-230Z" fill="#39ff14" fill-opacity="0.07"/>
  <path d="M1060 330c70-50 170-40 230 30 -60 60-170 50-230-30Z" fill="#39ff14" fill-opacity="0.06"/>
  <path d="M-30 300c60-20 130 10 160 70 -60 30-140 0-160-70Z" fill="#39ff14" fill-opacity="0.05"/>

  <!-- Logo (lulo) -->
  <circle cx="230" cy="205" r="150" fill="url(#halo)"/>
  <g transform="translate(118 85) scale(3.5)">
    <path d="M32 17 C33 12, 36 9, 40 7" fill="none" stroke="#39ff14" stroke-width="3" stroke-linecap="round"/>
    <path fill="#39ff14" d="M40 7c6-4 13-2 15 3 -3 5-10 8-16 5 -2-1-3-5 1-8Z"/>
    <circle cx="30" cy="39" r="22" fill="#39ff14"/>
    <path d="M30 19 C24 27, 22 35, 24 45 C25 51, 27 56, 30 59" fill="none" stroke="#0f1712" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <path d="M30 19 C36 27, 38 35, 36 45 C35 51, 33 56, 30 59" fill="none" stroke="#0f1712" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
    <path d="M10 35 C18 31, 42 31, 50 35" fill="none" stroke="#0f1712" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="21" cy="29" rx="5.5" ry="8.5" fill="#ffffff" fill-opacity="0.28" transform="rotate(-25 21 29)"/>
  </g>

  <!-- Textos -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="440" y="150" fill="#39ff14" font-size="20" font-weight="700" letter-spacing="6">CONTABILIDAD DEL CULTIVO DE LULO</text>
    <text x="436" y="235" fill="#ffffff" font-size="84" font-weight="800">Agro<tspan fill="#39ff14">Lulo</tspan> System</text>
    <text x="440" y="288" fill="#b8d5c1" font-size="28">Gastos, cosechas, pagos y ganancias en un solo lugar</text>
  </g>
</svg>
