services:
  agrolulo:
    build: .
    container_name: agrolulo_system
    environment:
      # Este archivo SÍ se sube a GitHub: aquí NUNCA van datos reales, solo
      # los nombres de las variables. Docker Compose toma cada ${VALOR} del
      # archivo .env de esta misma carpeta, que nunca se sube a git.
      # Son opcionales para poder arrancar sin ellas: sin SECRET_KEY las
      # sesiones se cierran en cada reinicio, y sin MAIL_* no salen correos.
      SECRET_KEY: ${SECRET_KEY:-}
      MAIL_SERVER: ${MAIL_SERVER:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SENDER: ${MAIL_SENDER:-}
      APP_URL: ${APP_URL:-http://127.0.0.1:5000}
      # Este archivo es para publicar la página detrás de un proxy con HTTPS.
      # Para probarlo sin HTTPS fuera de localhost, ponlo en 0 en el .env.
      DETRAS_DE_HTTPS: ${DETRAS_DE_HTTPS:-1}
    ports:
      # Solo desde el mismo servidor: desde internet se entra por el proxy con
      # HTTPS. Abierto a todos, cualquiera podría saltarse el proxy y
      # falsificar su IP para evitar los bloqueos de intentos.
      - "127.0.0.1:5000:5000"
    volumes:
      # Guarda la base de datos SQLite (flaskdb.sqlite) fuera del
      # contenedor, en la carpeta "instance" del proyecto, para que tus
      # cultivos, ingresos, gastos, pagos y usuarios NO se pierdan cada
      # vez que se reconstruye o reinicia el contenedor.
      - ./instance:/app/instance
    # Impide que un proceso del contenedor gane más permisos de los que tiene.
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
