{# Menú lateral del administrador (panel y ficha de cada cultivador). Solo lo que le corresponde:
   el admin no lleva cultivos. #}
  <!-- Menú lateral del administrador: solo lo que le corresponde -->
  <aside id="sidebarLulo" class="sidebar-lulo">
    <div class="mb-2">
      <button type="button" class="btn-toggle-menu" onclick="toggleSidebar()" aria-label="Alternar Menú">
        <i class="bi bi-list"></i>
        <span class="sidebar-nav-content fw-bold text-white fs-6">Menú</span>
      </button>
    </div>

    <div class="sidebar-nav-content d-flex flex-column h-100">
      <div class="text-center pb-3 my-2 border-bottom border-secondary border-opacity-25">
        <div class="brand-logo-badge mx-auto mb-2" style="width: 44px; height: 44px; font-size: 1.2rem;">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div class="sidebar-brand-title">AgroLulo <span>Admin</span></div>
      </div>

      <ul class="sidebar-menu list-unstyled flex-grow-1">
        <li>
          <a href="{{ url_for('auth.dashboard') }}" class="sidebar-link {% if menu_activo != 'usuarios' %}active{% endif %}">
            <div class="nav-icon-box"><i class="bi bi-speedometer2"></i></div>
            <span>Panel del Administrador</span>
          </a>
        </li>
        <li>
          <a href="{{ url_for('auth.usuarios') }}" class="sidebar-link">
            <div class="nav-icon-box" style="color: #4cc9f0; border-color: rgba(76, 201, 240, 0.3);">
              <i class="bi bi-people-fill"></i>
            </div>
            <span>Usuarios</span>
          </a>
        </li>
      </ul>

      <div class="pt-3 border-top border-secondary border-opacity-25 text-center">
        <a href="{{ url_for('auth.editar_perfil') }}" class="d-flex align-items-center justify-content-center gap-2 mb-2 px-2 py-1.5 rounded-pill text-decoration-none" style="background: rgba(57, 255, 20, 0.08); border: 1px solid var(--border-neon);" title="Cambiar usuario y contraseña">
          <i class="bi bi-person-circle fs-5" style="color: var(--neon-green);"></i>
          <span class="fw-bold text-light text-truncate" style="font-size: 0.88rem; max-width: 140px;">{{ current_user.nameUser }}</span>
        </a>
        <a href="{{ url_for('auth.logout') }}" class="sidebar-link link-logout justify-content-center">
          <div class="nav-icon-box" style="color: #ff4d4d; border-color: rgba(255, 77, 77, 0.3);">
            <i class="bi bi-box-arrow-right"></i>
          </div>
          <span>Cerrar Sesión</span>
        </a>
      </div>
    </div>
  </aside>
