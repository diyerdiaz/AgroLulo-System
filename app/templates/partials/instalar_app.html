{# Botón para instalar la página como app en el celular. Queda oculto hasta que
   static/js/instalar-app.js confirme que este navegador la puede instalar. #}
<div class="d-none text-center mt-3" data-instalar-app>
  <button type="button" class="btn btn-neon-outline px-4 py-2" data-instalar-boton>
    <i class="bi bi-phone me-1"></i> Instalar app
  </button>
  <p class="d-none small mt-2 mb-0" data-instalar-ayuda>
    En iPhone: abre esta página en Safari, toca Compartir y luego "Agregar a inicio".
  </p>
</div>
