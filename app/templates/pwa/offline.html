<!DOCTYPE html>
<html lang="es">

{# No extiende base.html: esta página queda guardada en el celular, así que no
   puede llevar el token de la sesión ni ningún dato de la cuenta. #}
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - AgroLulo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="dark-theme d-flex align-items-center justify-content-center min-vh-100 text-center p-4">
  <main>
    <img src="{{ url_for('static', filename='img/agrolulo-logo.svg') }}" alt="" width="96" height="96" class="mb-3">
    <h1 class="h4">No hay conexión a internet</h1>
    <p class="mb-4">AgroLulo necesita internet para mostrar tus datos.</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-neon-primary px-4 py-2">Intentar de nuevo</a>
  </main>
</body>

</html>
